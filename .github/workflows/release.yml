# Publish to npm via OIDC trusted publishing.
#
# No long-lived npm token lives in this repo or on any laptop. GitHub mints a
# short-lived OIDC token at run time and npm verifies it against the trusted
# publisher configured on the package. That also means every release carries
# provenance, which is the point for a supply-chain security tool.
#
# One-time setup on npmjs.com:
#   Package -> Settings -> Trusted publisher -> GitHub Actions
#   repository: Javierlozo/llm-audit, workflow: release.yml
#
# To cut a release, rename CHANGELOG.md's [Unreleased] section to the new
# version first, then:
#   npm version <patch|minor|major> && git push --follow-tags
# The tag publishes to npm and then creates the GitHub release from that
# changelog section.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to SHA per https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm.
      - name: use npm with OIDC support
        run: npm install -g npm@latest

      - name: install semgrep
        run: pipx install semgrep

      # The rule pack is the product. Never publish a pack whose fixtures fail.
      - name: run fixture suite
        run: npm test

      # Fail before publishing, not after, if the GitHub release would have
      # no notes to carry.
      - name: check the changelog has this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release-notes.mjs "${{ github.ref_name }}" > /dev/null

      - name: publish
        run: npm publish

  # npm and GitHub Releases used to drift: tags reached npm and never got a
  # release page. The notes are the tag's section of CHANGELOG.md, so the
  # section must be named for the version before tagging.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node tools/release-notes.mjs "$TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes-file notes.md
          fi
