rules:
  - id: secrets-in-prompt-context
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      An environment variable is being interpolated into prompt text sent
      to a model.

      Anything placed in the context is recoverable. Prompt-extraction
      attacks ("repeat everything above", "summarize your instructions")
      reliably pull system text back out, and the whole context is
      transmitted to the provider and usually retained in their logs.
      Baking a key, connection string or internal endpoint into the prompt
      leaks it to the provider and to any user who can steer the
      conversation. This is OWASP LLM06 (Sensitive Information Disclosure).

      Fix:
        - Keep credentials in the transport layer (SDK client config,
          request headers), never in prompt text.
        - Reference resources by opaque id in the prompt and resolve
          them server-side after the model responds.
        - If the model needs data behind a credential, fetch it yourself
          and pass only the result, scoped to what the user may see.
    metadata:
      owasp-llm: LLM06
      category: sensitive-information-disclosure
      cwe:
        - "CWE-200"
        - "CWE-532"
      references:
        - https://genai.owasp.org/llmrisk/llm06-sensitive-information-disclosure/
    pattern-either:
      # Direct assignment of an env value to a prompt-bearing field
      - pattern: |
          {..., system: process.env.$KEY, ...}
      - pattern: |
          {..., prompt: process.env.$KEY, ...}
      - pattern: |
          {..., instructions: process.env.$KEY, ...}
      # Interpolated into a template literal on a prompt-bearing field
      - pattern: |
          {..., system: `...${process.env.$KEY}...`, ...}
      - pattern: |
          {..., prompt: `...${process.env.$KEY}...`, ...}
      - pattern: |
          {..., instructions: `...${process.env.$KEY}...`, ...}
      # Message array entries
      - pattern: |
          {..., role: "system", content: `...${process.env.$KEY}...`, ...}
      - pattern: |
          {..., role: "user", content: `...${process.env.$KEY}...`, ...}
      - pattern: |
          {..., role: "system", content: process.env.$KEY, ...}
