<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="llm-audit">
  <title>llm-audit</title>
  <!--
    The mark is the product: an authority boundary.

    A prompt (the chevron) is untrusted input on its way into the model, and
    the amber bar is the boundary that stops it. Every rule in this pack is
    some version of that one idea: user text out of the system role, model
    output out of the eval sink, secrets out of the prompt. The banner draws
    the full diagram; the mark keeps only the two parts that carry it, so it
    still reads at 16px.

    Drawn on a 48-unit grid. The banner and the favicon in src/learn.mjs use
    the same two shapes; change all three together.
  -->
  <rect width="192" height="192" rx="42" fill="#12161c"/>
  <rect x="0.75" y="0.75" width="190.5" height="190.5" rx="41.25" fill="none" stroke="#242b35" stroke-width="1.5"/>
  <g transform="translate(96 96) scale(3) translate(-24 -24)">
    <path d="M14 13.5 24.5 24 14 34.5" fill="none" stroke="#e8edf4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30.5" y="9" width="6" height="30" rx="3" fill="#f0b429"/>
  </g>
</svg>
