<svg xmlns="http://www.w3.org/2000/svg" width="820" height="418" viewBox="0 0 820 418" role="img" aria-label="What you can run: six llm-audit commands, ordered by when you would reach for each one" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif">
<title>llm-audit — what you can run</title>
<rect width="820" height="418" rx="14" fill="#12161c"/>
<rect x="0.75" y="0.75" width="818.5" height="416.5" rx="13.25" fill="none" stroke="#242b35" stroke-width="1.5"/>
<text x="32" y="42" fill="#e8edf4" font-size="15" font-weight="600">What you can run</text>
<text x="184" y="42" fill="#6c7889" font-size="12.5">— six commands, in the order you would reach for them</text>
<line x1="36" y1="48" x2="36" y2="386" stroke="#242b35" stroke-width="2"/>
<circle cx="36" cy="66" r="3.5" fill="#f0b429" opacity="0.9"/>
<text x="54" y="62" fill="#6c7889" font-size="11" letter-spacing="0.08em">BEFORE YOU ADOPT IT</text>
<text x="54" y="82" fill="#f0b429" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">llm-audit demo</text>
<text x="336" y="82" fill="#8b98a9" font-size="13">Watch all twelve rules fire on bundled vulnerable code.</text>
<circle cx="36" cy="128" r="3.5" fill="#f0b429" opacity="0.9"/>
<text x="54" y="124" fill="#6c7889" font-size="11" letter-spacing="0.08em">WHILE YOU WRITE</text>
<text x="54" y="144" fill="#f0b429" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">llm-audit scan src</text>
<text x="336" y="144" fill="#8b98a9" font-size="13">Findings worst-first, each with the risk and the fix.</text>
<circle cx="36" cy="190" r="3.5" fill="#f0b429" opacity="0.9"/>
<text x="54" y="186" fill="#6c7889" font-size="11" letter-spacing="0.08em">WHEN YOU WANT THE WHY</text>
<text x="54" y="206" fill="#f0b429" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">llm-audit rules &lt;rule-id&gt;</text>
<text x="336" y="206" fill="#8b98a9" font-size="13">One rule in full, ending in code that is asserted safe.</text>
<circle cx="36" cy="252" r="3.5" fill="#f0b429" opacity="0.9"/>
<text x="54" y="248" fill="#6c7889" font-size="11" letter-spacing="0.08em">WHEN SOMEONE ELSE NEEDS IT</text>
<text x="54" y="268" fill="#f0b429" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">llm-audit scan --html r.html</text>
<text x="336" y="268" fill="#8b98a9" font-size="13">A self-contained report to attach to a PR or keep in CI.</text>
<circle cx="36" cy="314" r="3.5" fill="#f0b429" opacity="0.9"/>
<text x="54" y="310" fill="#6c7889" font-size="11" letter-spacing="0.08em">TO MAKE IT PERMANENT</text>
<text x="54" y="330" fill="#f0b429" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">llm-audit init --skill</text>
<text x="336" y="330" fill="#8b98a9" font-size="13">Pre-commit hook, CI workflow, and the coding-agent skill.</text>
<circle cx="36" cy="376" r="3.5" fill="#f0b429" opacity="0.9"/>
<text x="54" y="372" fill="#6c7889" font-size="11" letter-spacing="0.08em">WHEN SOMETHING IS OFF</text>
<text x="54" y="392" fill="#f0b429" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">llm-audit doctor</text>
<text x="336" y="392" fill="#8b98a9" font-size="13">Dependencies, project setup, and whether you are current.</text>
</svg>
