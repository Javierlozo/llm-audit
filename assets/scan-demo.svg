<svg xmlns="http://www.w3.org/2000/svg" width="615" height="474" viewBox="0 0 615 474" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="llm-audit scan output">
<rect fill="#12161c" width="615" height="474" rx="10"/>
<rect x="0.75" y="0.75" width="613.5" height="472.5" rx="9.25" fill="none" stroke="#242b35" stroke-width="1.5"/>

<text x="24" y="34" fill="#e8edf4" font-size="11" xml:space="preserve">$ npx llm-audit demo</text>
<text x="24" y="50" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
<text x="24" y="66" fill="#e8edf4" font-size="11" xml:space="preserve">test/fixtures/model-output-parsed-without-schema/vulnerable.ts</text>
<text x="24" y="82" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
<text x="24" y="98" fill="#f0b429" font-size="11" xml:space="preserve">  ✗ model-output-parsed-without-schema  LLM02  line 15</text>
<text x="24" y="114" fill="#8b98a9" font-size="11" xml:space="preserve">      Model output is being parsed with `JSON.parse` and used without</text>
<text x="24" y="130" fill="#8b98a9" font-size="11" xml:space="preserve">      schema validation. The model can return malformed JSON, unexpected</text>
<text x="24" y="146" fill="#8b98a9" font-size="11" xml:space="preserve">      fields, or attacker-steered content (LLM02 Insecure Output</text>
<text x="24" y="162" fill="#8b98a9" font-size="11" xml:space="preserve">      Handling). Parsing succeeds, downstream code trusts the shape, and</text>
<text x="24" y="178" fill="#8b98a9" font-size="11" xml:space="preserve">      security-relevant fields can be silently injected.</text>
<text x="24" y="194" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
<text x="24" y="210" fill="#8fb3d9" font-size="11" xml:space="preserve">      Fix:</text>
<text x="24" y="226" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
<text x="24" y="242" fill="#8fb3d9" font-size="11" xml:space="preserve">      - Use `generateObject` (AI SDK) or `responseFormat: json_schema`</text>
<text x="24" y="258" fill="#8b98a9" font-size="11" xml:space="preserve">        (OpenAI) so the model is constrained and parsing failure is</text>
<text x="24" y="274" fill="#8b98a9" font-size="11" xml:space="preserve">        structured.</text>
<text x="24" y="290" fill="#8fb3d9" font-size="11" xml:space="preserve">      - Run output through a schema validator (zod, valibot) before</text>
<text x="24" y="306" fill="#8b98a9" font-size="11" xml:space="preserve">        property access.</text>
<text x="24" y="322" fill="#8fb3d9" font-size="11" xml:space="preserve">      - Default-deny on unknown fields.</text>
<text x="24" y="338" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
<text x="24" y="354" fill="#c3ccd8" font-size="11" xml:space="preserve">     15 │   const data = JSON.parse(r.choices[0].message.content as string);</text>
<text x="24" y="370" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
<text x="24" y="386" fill="#484f58" font-size="11" xml:space="preserve">  ...</text>
<text x="24" y="402" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
<text x="24" y="418" fill="#3fb950" font-size="11" xml:space="preserve">42 findings in 12 files · 12 rules run</text>
<text x="24" y="434" fill="#8b98a9" font-size="11" xml:space="preserve"></text>
</svg>
