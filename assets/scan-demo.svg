<text class="ln l1" y="108" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="165.50" lengthAdjust="spacingAndGlyphs" fill="#e8edf4" font-weight="600">src/app/api/chat/route.ts</tspan><tspan x="187.50" textLength="79.44" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">  3 findings</tspan></text>
<text class="ln l3" y="140" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="13.24" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">  </tspan><tspan x="35.24" textLength="6.62" lengthAdjust="spacingAndGlyphs" fill="#f2777a">✗</tspan><tspan x="41.86" textLength="6.62" lengthAdjust="spacingAndGlyphs" fill="#e8edf4"> </tspan><tspan x="48.48" textLength="46.34" lengthAdjust="spacingAndGlyphs" fill="#f2777a">error  </tspan><tspan x="94.82" textLength="6.62" lengthAdjust="spacingAndGlyphs" fill="#e8edf4"> </tspan><tspan x="101.44" textLength="139.02" lengthAdjust="spacingAndGlyphs" fill="#e8edf4" font-weight="600">hardcoded-llm-api-key</tspan><tspan x="240.46" textLength="13.24" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">  </tspan><tspan x="253.70" textLength="33.10" lengthAdjust="spacingAndGlyphs" fill="#f0b429">LLM06</tspan><tspan x="286.80" textLength="52.96" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">  line 3</tspan></text>
<text class="ln l4" y="156" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="423.68" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">      An LLM provider API key appears to be hardcoded in source.</tspan></text>
<text class="ln l6" y="188" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="509.74" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">      Inline keys leak via git history, client bundles, logs, error messages,</tspan></text>
<text class="ln l7" y="204" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="476.64" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">      and screenshots. Even after rotation, a leaked key is a real-money</tspan></text>
<text class="ln l8" y="220" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="99.30" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">      incident.</tspan></text>
<text class="ln l10" y="252" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="66.20" lengthAdjust="spacingAndGlyphs" fill="#6aa9ff">      Fix:</tspan></text>
<text class="ln l12" y="284" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="483.26" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">      - Read keys from environment variables, validated at startup with a</tspan></text>
<text class="ln l13" y="300" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="370.72" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">        schema (e.g. zod). Default-deny on missing keys.</tspan></text>
<text class="ln l14" y="316" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="496.50" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">      - For platforms that support it (Vercel AI Gateway, AWS Bedrock), use</tspan></text>
<text class="ln l15" y="332" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="370.72" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">        OIDC / workload identity instead of static keys.</tspan></text>
<text class="ln l16" y="348" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="496.50" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">      - Run `gitleaks` or `trufflehog` in CI as a backstop, since this rule</tspan></text>
<text class="ln l17" y="364" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="331.00" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">        only catches the inline-constructor shape.</tspan></text>
<text class="ln l19" y="396" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="13.24" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">  </tspan><tspan x="35.24" textLength="46.34" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">    3 │</tspan><tspan x="81.58" textLength="6.62" lengthAdjust="spacingAndGlyphs" fill="#e8edf4"> </tspan><tspan x="88.20" textLength="542.84" lengthAdjust="spacingAndGlyphs" fill="#c792ea">const openai = new OpenAI({ apiKey: "sk-proj-AAAA1111BBBB2222CCCC3333DDDD4444" });</tspan></text>
<text class="ln l22" y="444" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="430.30" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">      ⋮  41 more lines — the rest of the report, then the summary</tspan></text>
<text class="ln l23" y="460" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="397.20" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">────────────────────────────────────────────────────────────</tspan></text>
<text class="ln l24" y="476" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="66.20" lengthAdjust="spacingAndGlyphs" fill="#e8edf4" font-weight="600">3 findings</tspan><tspan x="88.20" textLength="13.24" lengthAdjust="spacingAndGlyphs" fill="#e8edf4">  </tspan><tspan x="101.44" textLength="46.34" lengthAdjust="spacingAndGlyphs" fill="#f2777a">1 error</tspan><tspan x="147.78" textLength="19.86" lengthAdjust="spacingAndGlyphs" fill="#8b98a9"> · </tspan><tspan x="167.64" textLength="59.58" lengthAdjust="spacingAndGlyphs" fill="#f0b429">2 warning</tspan><tspan x="227.22" textLength="218.46" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">  in 1 file · 3 of 12 rules fired</tspan></text>
<text class="ln l25" y="492" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="139.02" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">Why each rule exists:</tspan><tspan x="161.02" textLength="423.68" lengthAdjust="spacingAndGlyphs" fill="#e8edf4"> https://github.com/Javierlozo/llm-audit/blob/main/docs/RULES.md</tspan></text>
<text class="ln l26" y="508" font-size="11" xml:space="preserve"><tspan x="22.00" textLength="105.92" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">Gate this in CI:</tspan><tspan x="127.92" textLength="218.46" lengthAdjust="spacingAndGlyphs" fill="#e8edf4"> llm-audit scan --fail-on error  </tspan><tspan x="346.38" textLength="198.60" lengthAdjust="spacingAndGlyphs" fill="#8b98a9">(or --sarif for code scanning)</tspan></text>
